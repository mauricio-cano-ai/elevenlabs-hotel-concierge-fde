name: ci

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip

      - name: Upgrade packaging toolchain
        run: python -m pip install --upgrade pip "setuptools>=84.0.0" wheel

      - name: Install project
        run: python -m pip install -e '.[dev]'

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format
        run: ruff format --check .

      - name: Mypy
        run: mypy app

      - name: Tests and coverage
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=85

      - name: Dependency audit
        run: pip-audit

      - name: Smoke test
        run: python scripts/smoke_test.py

      - name: Docker build
        run: docker build -t elevenlabs-hotel-concierge-fde .